MinAlertLevel = error
StylesPath = .vale/styles

[*]
BasedOnStyles = Microsoft, write-good

[^node_modules/]
[^.next/]
[^.mintlify/]

[*.mdx]

# --- Rules disabled for technical documentation ---
Microsoft.Quotes = NO
Microsoft.UIVerbs = NO
Microsoft.GeneralURL = NO
Microsoft.Headings = NO
Microsoft.HeadingsAcronyms = NO
Microsoft.SemanticLineBreaks = NO
Microsoft.Acronyms = NO
Microsoft.Contractions = NO
Microsoft.Spacing = NO
Microsoft.Dashes = NO         # Em-dashes in zh/ files; tech prose uses dashes correctly
Microsoft.Auto = NO            # Compound tech terms (self-hosted, multi-tenant) are correct
Microsoft.Negative = NO        # Negative numbers in code examples are fine

# --- Rules to enforce ---
Microsoft.Readability = YES
Microsoft.Foreign = YES
Microsoft.Repetition = YES
Microsoft.Avoid = YES
Microsoft.FirstPerson = NO    # Info only for docs
Microsoft.Ellipses = NO
Microsoft.We = NO
write-good.Wordiness = NO    # Too noisy for tech docs
write-good.TooWordy = NO     # 'implement', 'multiple' etc are fine in tech docs
write-good.E-Prime = NO
write-good.Passive = NO
write-good.SentenceLength = NO
write-good.Adverbs = NO
write-good.Illusions = YES   # Repeated words are real issues
write-good.ThereIs = YES     # 'There is/are' starts are weak writing
write-good.So = YES           # Starting with 'So' is weak
